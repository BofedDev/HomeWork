<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>User Profile</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="container">
    <h1>User Profile</h1>

    <div class="field">
        <label>First Name</label>
        <input type="text" placeholder="Введіть ім'я" data-user-first-name>
    </div>

    <div class="field">
        <label>Last Name</label>
        <input type="text" placeholder="Введіть прізвище" data-user-last-name>
    </div>

    <div class="field">
        <label>Email</label>
        <input type="email" placeholder="Введіть електронну адресу" data-user-email>
    </div>

    <div class="buttons">
        <button class="btn save">SAVE</button>
        <button class="btn freeze">FREEZE MODEL</button>
    </div>

    <div class="buttons">
        <button class="btn show-descriptors">SHOW DESCRIPTORS</button>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
